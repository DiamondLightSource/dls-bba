[metadata]
name = dls_bba
version = file: dls_bba/VERSION
description = Python 3 implementation of slow and fast BBA.
author = HLA
author_email = Joshua.Appleby@diamond.ac.uk
license = Apache
url = https://gitlab.diamond.ac.uk/controls/python3/bba

[options]
packages = dls_bba
include_package_data = true
install_requires =
    cothread>=2.15
    pygelf
    scipy
    numpy
    matplotlib
    pytac
    fa-archiver
tests_require =
    pytest
    pytest-cov
    mock
    mypy

[options.package_data]
dls_bba = VERSION

[flake8]
# The ui directory is autogenerated by pyuic5.
exclude = ui
ignore =
    E203  # Black claims this violates PEP-8
    E126
    W503  # Apparently controversial
    W504  # Apparently controversial
    D100  # Ignore documentation for now
    D101
    D102
    D103
    D104
    D107
# Use the default from Black.
max-line-length = 88

[mypy]
# Dls libraries e.g. cothread, are not recognised properly.
ignore_missing_imports = True
